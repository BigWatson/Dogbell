<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Team 4 U</title>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <div class="header">Login</div>
    <main class="center">
      <form id="login-form" style="display:flex;flex-direction:column;gap:10px;max-width:360px;width:100%;">
        <input id="username" placeholder="Username" required />
        <input id="password" placeholder="Password" type="password" required />
        <button class="btn" type="submit">Sign in</button>
        <div id="msg" style="color:#f88"></div>
      </form>
    </main>
    <footer class="footer"><a href="/homepage.html" style="color:#fff">Back</a></footer>
    <script type="module" src="/login.js"></script>
  </body>
</html>
