<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Create a Team 4 U account to set up your Raspberry Pi doorbell and SMS alerts." />
    <title>Sign Up - Team 4 U</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/TEAM4U.png" type="image/png" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>

    <nav class="navbar">
      <a class="nav-brand" href="/homepage.html"><span aria-hidden="true">🐾</span> Team 4 U</a>
      <div class="nav-links">
        <a class="nav-link" href="/homepage.html">Home</a>
        <a class="nav-link" href="/login.html">Login</a>
      </div>
    </nav>

    <main class="center">
      <form id="signup-form">
        <h2 class="form-title">Create Account</h2>
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" placeholder="At least 3 characters" autocomplete="username" minlength="3" required />
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" placeholder="At least 8 characters" type="password" autocomplete="new-password" minlength="8" required />
        <label for="password-confirm" class="form-label">Confirm password</label>
        <input id="password-confirm" name="password-confirm" placeholder="Re-enter password" type="password" autocomplete="new-password" minlength="8" required />
        <button class="btn" type="submit">Create account</button>
        <div id="msg" class="msg" role="alert" aria-live="polite"></div>
      </form>
    </main>

    <footer class="footer">
      <a href="/homepage.html" class="back-link">← Back to Home</a>
    </footer>

    <script type="module" src="/signup.js"></script>
  </body>
</html>
