spring.application.name=demo

# encryption.key is read from the ENCRYPTION_KEY environment variable.
# Example (PowerShell):
#   $env:ENCRYPTION_KEY = 'BASE64_32_BYTE_KEY'
# Or pass on the JVM command line: -Dencryption.key=BASE64_32_BYTE_KEY
encryption.key=${ENCRYPTION_KEY:}

mqtt.broker=tcp://broker.hivemq.com:1883         # public broker for quick tests (no auth)
# OR use local Mosquitto: tcp://localhost:1883
mqtt.client-id=demo-backend
textbelt.url=http://localhost:8080
textbelt.key=textbelt
# Optional SMTP fallback
spring.mail.host=smtp.example.com
spring.mail.port=465
spring.mail.username=...
spring.mail.password=...
sms.from=no-reply@example.com

