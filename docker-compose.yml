services:
  textbelt:
    build: ./textbelt-local
    image: textbelt:local
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TEXTBELT_REDIS_URL=redis://redis:6379
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=alfred.sherlock@gmail.com
      - SMTP_PASS=gcypapzejhxywgte
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped

# Note: The official textbelt image listens on port 80 inside the container. We map it
# to 8080 on the host so you can call http://localhost:8080/text