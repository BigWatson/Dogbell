version: '3.8'
services:
  textbelt:
    image: textbelt/textbelt:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TEXTBELT_REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped

# Note: The official textbelt image listens on port 80 inside the container. We map it
# to 8080 on the host so you can call http://localhost:8080/text